<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Sumo Arena</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body {
            background: #08090f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #banner-ad {
            width: 100%;
            height: 35px;
            background: #111420;
            border-bottom: 1px dashed #00e5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00e5ff;
            font-size: 11px;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        #game-box {
            position: relative;
            flex: 1;
            width: 100%;
            height: calc(100vh - 35px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #07080d;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 4 / 3;
            object-fit: contain;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(6, 7, 12, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            padding: 15px;
            text-align: center;
        }
        .hidden { display: none !important; }

        h1 { font-size: clamp(22px, 5vw, 36px); margin-bottom: 10px; color: #00e5ff; text-shadow: 0 0 15px rgba(0,229,255,0.4); }
        h2 { font-size: clamp(16px, 4vw, 22px); margin-bottom: 12px; }

        .btn {
            padding: 10px 20px;
            font-size: clamp(13px, 3.5vw, 15px);
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s;
            width: min(280px, 85vw);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-cyan { background: #00e5ff; color: #000; }
        .btn-gold { background: #ffbb00; color: #000; }
        .btn-magenta { background: #ff3366; color: #fff; }
        .btn-gray { background: #1c2030; color: #aaa; }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-card {
            background: rgba(15, 18, 30, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: clamp(10px, 3vw, 13px);
            font-weight: bold;
        }
        .btn-exit {
            pointer-events: auto;
            background: #ff3366;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        #stage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 8px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 10px;
            width: min(480px, 90vw);
            background: #0f121d;
            border-radius: 12px;
            border: 1px solid #20263a;
        }
        .stage-card {
            background: #171b2a;
            border: 2px solid #23293d;
            border-radius: 8px;
            padding: 10px 4px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .stage-card.unlocked { border-color: #00e5ff; color: #fff; }
        .stage-card.current { border-color: #ffbb00; color: #ffbb00; }
        .stage-card.boss { border-color: #ff0055; color: #ff0055; }
        .stage-card.locked { opacity: 0.3; }

        .shop-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(450px, 90vw);
            margin: 10px 0;
        }
        .stats-panel {
            background: #0f121d;
            border: 1px solid #20263a;
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-around;
        }
        .stat-item { font-size: 13px; }
        .stat-val { font-weight: bold; color: #00e5ff; }

        .shop-card {
            background: #0f121d;
            border: 1px solid #20263a;
            padding: 10px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .shop-btn {
            background: #ffbb00;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Virtual Mobile Joystick */
        #touch-controller {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 50%;
            display: none;
            touch-action: none;
            z-index: 8;
        }
        #stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 45px;
            height: 45px;
            background: #00e5ff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px #00e5ff;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="banner-ad">[ ADVERTISEMENT SPACE: RESPONSIVE BANNER ]</div>
    <div id="game-box">
        <canvas id="c" width="800" height="600"></canvas>
        
        <div id="touch-controller">
            <div id="stick"></div>
        </div>

        <div id="hud" class="hidden">
            <div class="hud-card" id="hud-left">STAGE: 1</div>
            <div class="hud-card" style="color:#ffbb00;">🪙 <span id="hud-coins">0</span></div>
            <div class="hud-card" id="hud-right"><button class="btn-exit" onclick="exitToMenu()">EXIT ✕</button></div>
        </div>

        <div id="menu-main" class="overlay">
            <h1>NEON SUMO ARENA</h1>
            <div style="font-size: 14px; color:#ffbb00; margin-bottom: 12px; font-weight:bold;">🪙 Coins: <span id="menu-coins">0</span></div>
            <button class="btn btn-cyan" onclick="showStageSelect()">🗺️ Stage Map</button>
            <button class="btn btn-gold" onclick="showShop()">⚙️ Upgrades</button>
        </div>

        <div id="menu-stages" class="overlay hidden">
            <h2>SELECT STAGE (<span id="unlocked-count">1</span> / 1000)</h2>
            <div id="stage-grid"></div>
            <button class="btn btn-gray" style="margin-top: 10px;" onclick="showMainMenu()">⬅ Back</button>
        </div>

        <div id="menu-shop" class="overlay hidden">
            <h2>SUMO STATS</h2>
            <div style="font-size: 13px; color:#ffbb00; margin-bottom: 8px; font-weight:bold;">🪙 Coins: <span id="shop-coins">0</span></div>
            
            <div class="shop-container">
                <div class="stats-panel">
                    <div class="stat-item">Weight: <span class="stat-val" id="stat-weight">Lvl 1</span></div>
                    <div class="stat-item">Power: <span class="stat-val" id="stat-power">Lvl 1</span></div>
                </div>

                <div class="shop-card">
                    <div style="text-align:left;">
                        <div style="font-size:13px; font-weight:bold;">🏋️ Weight (الوزن)</div>
                        <div style="font-size:10px; color:#aaa;">يكبر حجمك ويثبتك</div>
                    </div>
                    <button class="shop-btn" id="buy-weight" onclick="buyUpgrade('weight')">Buy</button>
                </div>

                <div class="shop-card">
                    <div style="text-align:left;">
                        <div style="font-size:13px; font-weight:bold;">💥 Power (القوة)</div>
                        <div style="font-size:10px; color:#aaa;">يزيد قوة الدفع</div>
                    </div>
                    <button class="shop-btn" id="buy-power" onclick="buyUpgrade('power')">Buy</button>
                </div>
            </div>

            <button class="btn btn-gray" onclick="showMainMenu()">⬅ Back</button>
        </div>

        <div id="modal-death" class="overlay hidden">
            <h1 style="color:#ff3366;">RING OUT!</h1>
            <button class="btn btn-cyan" onclick="reviveOffline()">📺 Retry Stage</button>
            <button class="btn btn-gray" onclick="exitToMenu()">Stage Map</button>
        </div>

        <div id="modal-win-stage" class="overlay hidden">
            <h1 style="color:#00ff66;">STAGE CLEARED!</h1>
            <p style="margin-bottom: 10px; color:#ffbb00; font-size: 14px;">+5 Coins Earned! 🪙</p>
            <button class="btn btn-cyan" onclick="nextStageOffline()">Next Stage ➔</button>
            <button class="btn btn-gray" onclick="showStageSelect()">Stage Map</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const touchBox = document.getElementById('touch-controller');
        const stick = document.getElementById('stick');

        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        let touchVec = { x: 0, y: 0 };

        if (isTouch) {
            let activeTouchId = null;
            let startX = 0, startY = 0;

            touchBox.addEventListener('touchstart', e => {
                let t = e.changedTouches[0];
                activeTouchId = t.identifier;
                let rect = touchBox.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
            }, { passive: false });

            window.addEventListener('touchmove', e => {
                if (activeTouchId === null) return;
                for (let t of e.changedTouches) {
                    if (t.identifier === activeTouchId) {
                        let dx = t.clientX - startX;
                        let dy = t.clientY - startY;
                        let dist = Math.hypot(dx, dy);
                        let maxDist = 45;
                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }
                        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        touchVec.x = dx / maxDist;
                        touchVec.y = dy / maxDist;
                    }
                }
            }, { passive: false });

            const resetTouch = e => {
                for (let t of e.changedTouches) {
                    if (t.identifier === activeTouchId) {
                        activeTouchId = null;
                        touchVec = { x: 0, y: 0 };
                        stick.style.transform = `translate(-50%, -50%)`;
                    }
                }
            };
            window.addEventListener('touchend', resetTouch);
            window.addEventListener('touchcancel', resetTouch);
        }

        const CENTER_X = 400;
        const CENTER_Y = 300;
        const BASE_ARENA_RADIUS = 240;

        let coins = parseInt(localStorage.getItem('sumo_coins') || '0');
        let maxUnlockedStage = parseInt(localStorage.getItem('sumo_stage') || '1');
        let rawUpgrades = localStorage.getItem('sumo_upgrades');
        let upgrades = { weight: 1, power: 1 };
        try {
            if (rawUpgrades) {
                let parsed = JSON.parse(rawUpgrades);
                upgrades.weight = parsed.weight || 1;
                upgrades.power = parsed.power || 1;
            }
        } catch(e) {}

        function saveData() {
            localStorage.setItem('sumo_coins', coins);
            localStorage.setItem('sumo_stage', maxUnlockedStage);
            localStorage.setItem('sumo_upgrades', JSON.stringify(upgrades));
            updateCoinDisplays();
        }

        function updateCoinDisplays() {
            document.getElementById('menu-coins').innerText = coins;
            document.getElementById('hud-coins').innerText = coins;
            document.getElementById('shop-coins').innerText = coins;
        }
        updateCoinDisplays();

        let gameMode = 'none';
        let currentPlayingStage = 1;
        let offlineArenaRadius = BASE_ARENA_RADIUS;
        let player = { x: 400, y: 300, vx: 0, vy: 0, radius: 24, color: '#00e5ff', alive: true };
        let bots = [];
        let keys = {};
        let stageEnded = false;

        window.onkeydown = e => keys[e.key.toLowerCase()] = true;
        window.onkeyup = e => keys[e.key.toLowerCase()] = false;

        function hideAllMenus() {
            document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
            document.getElementById('hud').classList.add('hidden');
            if (touchBox) touchBox.style.display = 'none';
        }

        function showMainMenu() {
            hideAllMenus();
            gameMode = 'none';
            updateCoinDisplays();
            document.getElementById('menu-main').classList.remove('hidden');
        }

        function showStageSelect() {
            hideAllMenus();
            document.getElementById('unlocked-count').innerText = maxUnlockedStage;
            const grid = document.getElementById('stage-grid');
            grid.innerHTML = '';
            
            let limit = Math.min(1000, maxUnlockedStage + 12);
            for (let i = 1; i <= limit; i++) {
                let card = document.createElement('div');
                card.className = 'stage-card';
                let isBossStage = (i % 5 === 0);
                if (isBossStage) card.classList.add('boss');

                if (i <= maxUnlockedStage) {
                    card.classList.add('unlocked');
                    if (i === maxUnlockedStage) card.classList.add('current');
                    card.innerText = isBossStage ? `👑 ${i}` : `${i}`;
                    card.onclick = () => startOfflineStage(i);
                } else {
                    card.classList.add('locked');
                    card.innerText = `🔒`;
                }
                grid.appendChild(card);
            }
            document.getElementById('menu-stages').classList.remove('hidden');
        }

        function showShop() {
            hideAllMenus();
            updateCoinDisplays();

            document.getElementById('stat-weight').innerText = `Lvl ${upgrades.weight} (${100 + upgrades.weight * 20} KG)`;
            document.getElementById('stat-power').innerText = `Lvl ${upgrades.power} (${100 + upgrades.power * 25} N)`;

            document.getElementById('buy-weight').innerText = `Buy (${upgrades.weight * 20}🪙)`;
            document.getElementById('buy-power').innerText = `Buy (${upgrades.power * 20}🪙)`;

            document.getElementById('menu-shop').classList.remove('hidden');
        }

        function buyUpgrade(type) {
            let cost = upgrades[type] * 20;
            if (coins >= cost) {
                coins -= cost;
                upgrades[type]++;
                saveData();
                showShop();
            } else {
                alert("Coins are not enough!");
            }
        }

        function exitToMenu() {
            showMainMenu();
        }

        function startOfflineStage(lvl) {
            gameMode = 'offline';
            currentPlayingStage = lvl;
            hideAllMenus();
            document.getElementById('hud').classList.remove('hidden');
            if (isTouch) touchBox.style.display = 'block';
            spawnOfflineStage(currentPlayingStage);
        }

        function spawnOfflineStage(lvl) {
            stageEnded = false;
            offlineArenaRadius = BASE_ARENA_RADIUS;
            player.x = 400;
            player.y = 300;
            player.vx = 0;
            player.vy = 0;
            player.alive = true;
            player.radius = 22 + (upgrades.weight * 1.5);

            bots = [];
            let isBossLevel = (lvl % 5 === 0);
            let stageBaseMass = 0.5 + (lvl * 0.08);
            let stageBasePower = 3.0 + (lvl * 0.35);

            if (isBossLevel) {
                bots.push({
                    x: 400,
                    y: 160,
                    vx: 0, vy: 0,
                    radius: 30 + (lvl * 0.4),
                    mass: stageBaseMass * 1.8,
                    speed: 0.28,
                    power: stageBasePower * 1.4,
                    color: '#ff0055',
                    isBoss: true,
                    alive: true
                });
            } else {
                let botCount = Math.min(1 + Math.floor(lvl / 3), 3);
                let spawnDist = 140;

                for (let i = 0; i < botCount; i++) {
                    let ang = (i / botCount) * Math.PI * 2 + (Math.PI / 4);
                    bots.push({
                        x: 400 + Math.cos(ang) * spawnDist,
                        y: 300 + Math.sin(ang) * spawnDist,
                        vx: 0, vy: 0,
                        radius: 18 + (lvl * 0.3),
                        mass: stageBaseMass,
                        speed: 0.24 + Math.min(0.2, lvl * 0.01),
                        power: stageBasePower,
                        color: lvl >= 6 ? '#ff6600' : '#ffaa00',
                        isBoss: false,
                        alive: true
                    });
                }
            }
            document.getElementById('hud-left').innerText = isBossLevel ? `👑 BOSS: ${lvl}` : `STAGE: ${lvl}`;
            updateCoinDisplays();
        }

        function reviveOffline() {
            hideAllMenus();
            document.getElementById('hud').classList.remove('hidden');
            if (isTouch) touchBox.style.display = 'block';
            spawnOfflineStage(currentPlayingStage);
        }

        function nextStageOffline() {
            hideAllMenus();
            document.getElementById('hud').classList.remove('hidden');
            if (isTouch) touchBox.style.display = 'block';
            startOfflineStage(currentPlayingStage + 1);
        }

        setInterval(() => {
            if (gameMode !== 'offline' || stageEnded || !player.alive) return;

            let dx = 0, dy = 0;
            if (keys['arrowup'] || keys['w']) dy -= 1;
            if (keys['arrowdown'] || keys['s']) dy += 1;
            if (keys['arrowleft'] || keys['a']) dx -= 1;
            if (keys['arrowright'] || keys['d']) dx += 1;

            if (isTouch && (touchVec.x !== 0 || touchVec.y !== 0)) {
                dx = touchVec.x;
                dy = touchVec.y;
            }

            let moveForce = 0.72;
            player.vx += dx * moveForce;
            player.vy += dy * moveForce;

            player.vx *= 0.92;
            player.vy *= 0.92;

            player.x += player.vx;
            player.y += player.vy;

            if (offlineArenaRadius > BASE_ARENA_RADIUS * 0.65) {
                offlineArenaRadius -= 0.015;
            }

            if (Math.hypot(player.x - 400, player.y - 300) > offlineArenaRadius) {
                player.alive = false;
                stageEnded = true;
                hideAllMenus();
                document.getElementById('modal-death').classList.remove('hidden');
                return;
            }

            let activeBots = bots.filter(b => b.alive);
            for (let b of activeBots) {
                let angToPlayer = Math.atan2(player.y - b.y, player.x - b.x);
                
                b.vx += Math.cos(angToPlayer) * b.speed;
                b.vy += Math.sin(angToPlayer) * b.speed;

                b.vx *= 0.93;
                b.vy *= 0.93;
                b.x += b.vx;
                b.y += b.vy;

                if (Math.hypot(b.x - 400, b.y - 300) > offlineArenaRadius) {
                    b.alive = false;
                }

                let cdx = b.x - player.x;
                let cdy = b.y - player.y;
                let cdist = Math.hypot(cdx, cdy);

                if (cdist < player.radius + b.radius) {
                    let overlap = (player.radius + b.radius) - cdist;
                    let cang = Math.atan2(cdy, cdx);

                    player.x -= Math.cos(cang) * (overlap * 0.4);
                    player.y -= Math.sin(cang) * (overlap * 0.4);
                    b.x += Math.cos(cang) * (overlap * 0.6);
                    b.y += Math.sin(cang) * (overlap * 0.6);

                    let playerMass = 1.0 + (upgrades.weight * 0.35);
                    let playerHitPower = 6.0 + (upgrades.power * 1.8);

                    let playerSpeedMag = Math.hypot(player.vx, player.vy);
                    let totalPlayerPush = playerHitPower * (1 + playerSpeedMag * 0.25);

                    player.vx -= Math.cos(cang) * (b.power / playerMass);
                    player.vy -= Math.sin(cang) * (b.power / playerMass);
                    b.vx += Math.cos(cang) * (totalPlayerPush / b.mass);
                    b.vy += Math.sin(cang) * (totalPlayerPush / b.mass);
                }
            }

            if (activeBots.length === 0 && !stageEnded) {
                stageEnded = true;
                coins += 5;
                if (currentPlayingStage === maxUnlockedStage && maxUnlockedStage < 1000) {
                    maxUnlockedStage++;
                }
                saveData();
                hideAllMenus();
                document.getElementById('modal-win-stage').classList.remove('hidden');
            }
        }, 1000 / 60);

        function draw() {
            ctx.clearRect(0, 0, 800, 600);

            if (gameMode !== 'none') {
                ctx.beginPath();
                ctx.arc(400, 300, offlineArenaRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#0f121d';
                ctx.fill();
                ctx.lineWidth = 5;
                ctx.strokeStyle = offlineArenaRadius < BASE_ARENA_RADIUS * 0.7 ? '#ff0055' : '#00e5ff';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(400, 300, offlineArenaRadius * 0.5, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 2;
                ctx.stroke();

                for (let b of bots) {
                    if (!b.alive) continue;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.shadowColor = b.isBoss ? '#ff0055' : 'transparent';
                    ctx.shadowBlur = b.isBoss ? 20 : 0;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = b.isBoss ? 4 : 2;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();

                    if (b.isBoss) {
                        ctx.fillStyle = '#ff0055';
                        ctx.font = 'bold 12px Segoe UI';
                        ctx.textAlign = 'center';
                        ctx.fillText("👑 BOSS", b.x, b.y - b.radius - 8);
                    }
                }

                if (player.alive) {
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                    ctx.fillStyle = player.color;
                    ctx.shadowColor = player.color;
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                }
            }

            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
</body>
</html>
